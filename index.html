<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Aline Arcanjo | 27</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700;900&display=swap');

        /* Remove o destaque azul de toque em dispositivos móveis */
        * { -webkit-tap-highlight-color: transparent; box-sizing: border-box; }

        body {
            margin: 0;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #000 url('fundo2.jpg') no-repeat center center;
            background-size: contain;
            font-family: 'Montserrat', sans-serif;
            perspective: 2000px;
            overflow: hidden;
            transition: background-image 0.4s ease-in-out;
        }

        /* Overlay sutil para garantir leitura dos textos sobre qualquer foto */
        body::before {
            content: '';
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.1);
            z-index: 0;
        }

        .card-container {
            width: 88vw;
            max-width: 350px;
            height: 75vh;
            max-height: 580px;
            position: relative;
            transform-style: preserve-3d;
            transition: transform 0.8s cubic-bezier(0.4, 0, 0.2, 1);
            z-index: 10;
        }

        .is-flipped { transform: rotateY(180deg); }

        .card-face {
            position: absolute;
            width: 100%; height: 100%;
            backface-visibility: hidden;
            border-radius: 25px;
            border: 2px solid rgba(212, 175, 55, 0.8);
            display: flex;
            flex-direction: column;
            background: transparent;
            backdrop-filter: blur(2px);
            -webkit-backdrop-filter: blur(2px);
            overflow: hidden;
        }

        .card-front {
            justify-content: center;
            align-items: center;
            padding: 20px;
            text-align: center;
        }

        .nome-container {
            width: 100%;
            padding: 30px 10px;
            border: 3px solid #d4af37;
            border-radius: 20px;
            background: rgba(0,0,0,0.4);
        }

        .nome-container h1 { font-size: 26px; font-weight: 900; color: #fff; margin: 0; letter-spacing: 2px; text-transform: uppercase; }
        .nome-container p { font-weight: 700; font-size: 18px; color: #d4af37; margin: 8px 0 0; letter-spacing: 4px; }

        .progress-wrapper { width: 100%; margin-top: 50px; padding: 0 20px; }
        .progress-text { 
            font-size: 8px; 
            color: #fff; 
            text-transform: uppercase; 
            letter-spacing: 1px; 
            margin-bottom: 8px; 
            display: block; 
            font-weight: 700; 
            text-shadow: 1px 1px 2px #000; 
            min-height: 24px; 
        }
        
        .progress-bar-bg { width: 100%; height: 6px; background: rgba(255,255,255,0.2); border-radius: 10px; overflow: hidden; }
        .progress-fill { 
            height: 100%; 
            background: #d4af37; 
            width: 0%; 
            transition: width 1.5s ease-out; 
            box-shadow: 0 0 15px rgba(212, 175, 55, 0.6); 
        }

        .tap-hint { margin-top: 50px; font-size: 9px; color: #d4af37; font-weight: 900; letter-spacing: 2px; text-transform: uppercase; }

        /* VERSO DO CARD */
        .card-back { transform: rotateY(180deg); padding: 35px 20px 0; color: #fff; }

        .girls-only { 
            font-size: 28px; 
            font-weight: 900; 
            color: #d4af37; 
            text-align: center; 
            margin-bottom: 30px; 
            text-transform: uppercase; 
            text-shadow: 2px 2px 10px rgba(0,0,0,1); 
        }
        
        .info-title { font-size: 10px; font-weight: 700; color: #d4af37; text-transform: uppercase; margin-bottom: 5px; display: block; }
        .info-content { font-size: 18px; font-weight: 700; margin-bottom: 25px; text-shadow: 2px 2px 4px #000; }

        /* ÁREA DE INTERAÇÃO */
        .confirm-area {
            margin-top: auto;
            background: rgba(0,0,0,0.85);
            padding: 20px;
            border-radius: 0 0 23px 23px;
            width: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        input {
            width: 100%;
            background: transparent;
            border: none;
            border-bottom: 2px solid #d4af37;
            color: #fff;
            padding: 10px 0;
            margin-bottom: 20px;
            outline: none;
            font-family: 'Montserrat', sans-serif;
            font-size: 16px;
            text-align: center;
        }

        .btn-group { width: 100%; display: flex; flex-direction: column; gap: 10px; align-items: center; }
        .btn { 
            width: 100%; 
            border: none; 
            border-radius: 10px; 
            font-family: 'Montserrat', sans-serif; 
            font-weight: 900; 
            text-transform: uppercase; 
            cursor: pointer; 
            transition: all 0.2s cubic-bezier(0.175, 0.885, 0.32, 1.275); 
        }
        
        #btn-sim { background: #d4af37; color: #000; padding: 15px; font-size: 14px; z-index: 2; }
        #btn-nao { background: #333; color: #fff; padding: 10px; font-size: 11px; opacity: 0.7; }
        
        /* Estilização Spotify */
        #btn-spotify { 
            background: #1DB954; 
            color: #fff; 
            padding: 10px; 
            font-size: 10px; 
            margin-bottom: 5px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }
    </style>
</head>
<body>

    <div class="card-container" id="card">
        <div class="card-face card-front">
            <div class="nome-container">
                <h1>ALINE ARCANJO</h1>
                <p>27 ANOS</p>
            </div>
            <div class="progress-wrapper">
                <span class="progress-text" id="prog-txt">DEPLOYING ALINE...</span>
                <div class="progress-bar-bg">
                    <div class="progress-fill" id="prog-bar"></div>
                </div>
            </div>
            <div class="tap-hint">Toque para mais informações</div>
        </div>

        <div class="card-face card-back">
            <div class="girls-only">SÓ PARA MENINAS</div>
            <span class="info-title">📅 DATA</span>
            <div class="info-content">Dia 23, Sábado, Maio</div>
            <span class="info-title">📍 LOCAL & HORA</span>
            <div class="info-content">Na Roça (12km) | 09h às 18h</div>
            <span class="info-title">👙 TRAJE</span>
            <div class="info-content">Traga seu traje de banho.</div>

            <div class="confirm-area">
                <input type="text" id="guest" placeholder="DIGITE SEU NOME">
                <div class="btn-group">
                    <button class="btn" id="btn-spotify" onclick="window.open('https://open.spotify.com/playlist/05kts8O5ai7kVFmSYLMQS7?si=3aa55864fc344261&pt=e99eb5895fc6bd6b8bd06fe8950a949f', '_blank')">
                        <svg width="16" height="16" viewBox="0 0 24 24" fill="white"><path d="M12 0C5.373 0 0 5.373 0 12s5.373 12 12 12 12-5.373 12-12S18.627 0 12 0zm5.494 17.306c-.215.353-.674.464-1.026.249-2.836-1.733-6.406-2.126-10.61-1.168-.403.092-.806-.16-.898-.562-.093-.403.159-.806.562-.898 4.607-1.053 8.547-.604 11.722 1.339.351.214.463.673.25 1.04zm1.465-3.263c-.27.441-.845.58-1.286.31-3.246-1.995-8.196-2.573-12.036-1.407-.496.151-1.022-.128-1.173-.625-.15-.497.129-1.022.625-1.172 4.388-1.332 9.83-.677 13.56 1.614.44.27.58.845.31 1.28zm.136-3.41c-3.894-2.313-10.32-2.525-14.076-1.385-.598.181-1.237-.156-1.418-.754-.182-.598.156-1.237.754-1.418 4.318-1.311 11.416-1.065 15.91 1.604.537.319.715 1.012.396 1.549-.319.537-1.012.715-1.55.397z"/></svg>
                        ADICIONE 10 MÚSICAS AQUI
                    </button>
                    <button class="btn" id="btn-sim" onclick="confirmar()">VOU COM CERTEZA</button>
                    <button class="btn" id="btn-nao" onclick="rejeitar(event)">Não poderei ir</button>
                </div>
            </div>
        </div>
    </div>

    <script>
        const card = document.getElementById('card');
        const btnSim = document.getElementById('btn-sim');
        const btnNao = document.getElementById('btn-nao');
        const progTxt = document.getElementById('prog-txt');
        
        let escalaSim = 1;
        let escalaNao = 1;
        let i = 0;

        // Frases sincronizadas com a troca de fotos
        const statusFrases = [
            "Deploying 27 Years of Aline...",
            "Sincronizando com o Sol da Roça...",
            "Status: Preparando o Tanque...",
            "Nível de Farra: Carregando...",
            "Iniciando Módulo Sertão Premium...",
            "Conectando ao modo Pagodinho...",
            "Churrasco: 99% Concluído...",
            "Analisando Lote (12km adiante)...",
            "Ajustando Traje de Banho...",
            "Configurando Modo Só Meninas...",
            "Verificando estoque de alegria...",
            "Aline v27.0: Carregando Assets...",
            "Protocolo Sábado: Iniciado...",
            "Gerando convites dinâmicos...",
            "Otimizando vibe sertaneja...",
            "Processando 23 de Maio...",
            "Finalizando Deploy: Quase lá!",
            "Tudo pronto. Só falta você!"
        ];

        // Lista dinâmica das imagens 2 a 19
        const imagens = [];
        for (let n = 2; n <= 19; n++) {
            let ext = (n === 8) ? '.png' : '.jpg';
            imagens.push(`fundo${n}${ext}`);
        }

        // Lógica do botão fujão
        function rejeitar(e) {
            e.stopPropagation();
            escalaSim += 0.3; escalaNao -= 0.2;
            btnSim.style.transform = `scale(${escalaSim})`;
            btnNao.style.transform = `scale(${escalaNao})`;
            btnNao.style.opacity = escalaNao;
            if (escalaNao <= 0.2) {
                btnNao.style.display = 'none';
                btnSim.style.width = '100%';
                btnSim.innerText = "VOCÊ VAI SIM! CONFIRMA AGORA";
            }
        }

        // Evento de giro do card e troca de fundo/texto
        card.addEventListener('click', function(e) {
            if (e.target.tagName === 'INPUT' || e.target.classList.contains('btn')) return;
            this.classList.toggle('is-flipped');
            i = (i + 1) % imagens.length;
            document.body.style.backgroundImage = `url('${imagens[i]}')`;
            progTxt.innerText = statusFrases[i] || "DEPLOYING ALINE...";
        });

        function confirmar() {
            const nome = document.getElementById('guest').value;
            if(!nome) return alert("Por favor, digite seu nome!");
            const phone = "5574988017089";
            const text = encodeURIComponent(nome.toUpperCase() + " CONFIRMADA! JÁ ADICIONEI MINHAS MÚSICAS.");
            window.open(`https://api.whatsapp.com/send?phone=${phone}&text=${text}`);
        }

        // Barra de progresso dinâmica baseada na data
        window.onload = () => {
            const now = new Date();
            const start = new Date(now.getFullYear(), 4, 1); 
            const target = new Date(now.getFullYear(), 4, 23); 
            let percent = Math.min(Math.max(((now - start) / (target - start)) * 100, 5), 100);
            document.getElementById('prog-bar').style.width = percent + '%';
            progTxt.innerText = statusFrases[0];
        };
    </script>
</body>
</html>
