<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>ALINE ARCANJO // 27</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@300;700&display=swap');

        :root {
            --pink: #ff007f;
            --dark: #050506;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'JetBrains Mono', monospace; }

        body {
            background-color: var(--dark);
            height: 100vh;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
            perspective: 2000px;
        }

        #canvas-mesh {
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            z-index: 1;
        }

        /* Estrutura do Card Centralizado */
        .scene {
            width: 90%;
            max-width: 340px;
            height: 480px; /* Altura ajustada para não sobrar espaço */
            z-index: 10;
            cursor: pointer;
        }

        .card-inner {
            position: relative;
            width: 100%;
            height: 100%;
            transition: transform 0.7s cubic-bezier(0.15, 0.85, 0.35, 1.2);
            transform-style: preserve-3d;
        }

        .card-inner.is-flipped {
            transform: rotateY(180deg);
        }

        .card-face {
            position: absolute;
            width: 100%;
            height: 100%;
            backface-visibility: hidden;
            -webkit-backface-visibility: hidden;
            display: flex;
            flex-direction: column;
            justify-content: center; /* Centraliza tudo verticalmente */
            align-items: center;    /* Centraliza tudo horizontalmente */
            padding: 30px;
            border-radius: 4px;
            background: rgba(10, 10, 12, 0.9);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 0, 127, 0.4);
            box-shadow: 0 0 30px rgba(255, 0, 127, 0.15);
        }

        .face-back { transform: rotateY(180deg); }

        /* Estilização dos Textos */
        .sys-label { font-size: 0.6rem; color: var(--pink); letter-spacing: 3px; margin-bottom: 15px; text-transform: uppercase; }
        
        h1 { font-size: 2.5rem; font-weight: 700; color: #fff; line-height: 1; }
        .surname { font-size: 1.4rem; font-weight: 300; color: #fff; opacity: 0.8; letter-spacing: 4px; margin-bottom: 15px; }
        .age { font-size: 5rem; font-weight: 700; color: var(--pink); text-shadow: 0 0 20px var(--pink); margin-bottom: 25px; }

        .details-box {
            width: 100%;
            display: flex;
            justify-content: space-around;
            border-top: 1px solid rgba(255, 0, 127, 0.3);
            padding-top: 20px;
            margin-bottom: 15px;
        }

        .d-item .l { font-size: 0.55rem; color: var(--pink); display: block; margin-bottom: 5px; }
        .d-item .v { font-size: 1rem; font-weight: bold; color: #fff; }

        .secret-msg { font-size: 1.1rem; line-height: 1.5; color: #fff; text-align: center; }
        .pink-bold { color: var(--pink); font-weight: bold; }

        .btn-confirm {
            background: var(--pink);
            color: #fff;
            border: none;
            padding: 16px;
            width: 100%;
            font-weight: bold;
            letter-spacing: 2px;
            cursor: pointer;
            margin-top: 20px;
            text-transform: uppercase;
        }

        /* Cantos Tech */
        .c { position: absolute; width: 15px; height: 15px; border: 2px solid var(--pink); }
        .tl { top: -2px; left: -2px; border-right: none; border-bottom: none; }
        .br { bottom: -2px; right: -2px; border-left: none; border-top: none; }

        /* Modal */
        #modal { position: fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.98); z-index:100; display:none; align-items:center; justify-content:center; }
        .m-box { width: 85%; max-width: 300px; text-align: center; }
        input { background: transparent; border: none; border-bottom: 2px solid var(--pink); color: #fff; width: 100%; padding: 15px; margin-bottom: 25px; font-size: 1.2rem; outline: none; text-align: center; }
    </style>
</head>
<body>

<canvas id="canvas-mesh"></canvas>

<div class="scene">
    <div class="card-inner" id="card">
        
        <div class="card-face face-front">
            <div class="c tl"></div><div class="c br"></div>
            <p class="sys-label">Protocolo_Ativo</p>
            <h1>ALINE</h1>
            <p class="surname">ARCANJO</p>
            <p class="age">27</p>
            <div class="details-box">
                <div class="d-item"><span class="l">> DATA</span><span class="v">23.MAI</span></div>
                <div class="d-item"><span class="l">> HORA</span><span class="v">10:00H</span></div>
            </div>
            <p style="font-size: 0.5rem; color: var(--pink); opacity: 0.6;">CLIQUE PARA DETALHES</p>
        </div>

        <div class="card-face face-back">
            <div class="c tl"></div><div class="c br"></div>
            <p class="sys-label">Localização_Liberada</p>
            <p class="secret-msg">
                O <span class="pink-bold">aniversário</span> será em uma <span class="pink-bold">roça a 12km</span> de distância.<br><br>
                Aproveite o sol: leve seu <span class="pink-bold">traje de banho</span>!
            </p>
            <button class="btn-confirm" onclick="event.stopPropagation(); openModal();">Confirmar</button>
        </div>

    </div>
</div>

<div id="modal">
    <div class="m-box">
        <p style="color: var(--pink); font-size: 0.7rem; margin-bottom: 10px;">SEU NOME:</p>
        <input type="text" id="guest" placeholder="..." autocomplete="off">
        <button class="btn-confirm" onclick="enviar()">Enviar</button>
    </div>
</div>

<script>
    // --- Efeito Mesh Interativo ---
    const canvas = document.getElementById('canvas-mesh');
    const ctx = canvas.getContext('2d');
    let points = [];
    const mouse = { x: null, y: null, radius: 150 };

    function init() {
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;
        points = [];
        for (let i = 0; i < 80; i++) {
            points.push({
                x: Math.random() * canvas.width,
                y: Math.random() * canvas.height,
                origX: Math.random() * canvas.width,
                origY: Math.random() * canvas.height,
                size: Math.random() * 2 + 1
            });
        }
    }

    function animate() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        ctx.fillStyle = "rgba(255, 0, 127, 0.5)";
        ctx.strokeStyle = "rgba(255, 0, 127, 0.15)";

        points.forEach((p, i) => {
            let dx = mouse.x - p.x;
            let dy = mouse.y - p.y;
            let dist = Math.sqrt(dx*dx + dy*dy);
            
            if (dist < mouse.radius) {
                p.x -= dx/10;
                p.y -= dy/10;
            } else {
                p.x += (p.origX - p.x) * 0.05;
                p.y += (p.origY - p.y) * 0.05;
            }

            ctx.beginPath();
            ctx.arc(p.x, p.y, p.size, 0, Math.PI*2);
            ctx.fill();

            for (let j = i; j < points.length; j++) {
                let d2 = Math.sqrt(Math.pow(p.x - points[j].x, 2) + Math.pow(p.y - points[j].y, 2));
                if (d2 < 100) {
                    ctx.beginPath();
                    ctx.moveTo(p.x, p.y);
                    ctx.lineTo(points[j].x, points[j].y);
                    ctx.stroke();
                }
            }
        });
        requestAnimationFrame(animate);
    }

    window.addEventListener('mousemove', e => { mouse.x = e.x; mouse.y = e.y; });
    window.addEventListener('touchstart', e => { mouse.x = e.touches[0].clientX; mouse.y = e.touches[0].clientY; });
    window.addEventListener('resize', init);
    init(); animate();

    // --- Giro do Card ---
    const card = document.getElementById('card');
    card.addEventListener('click', () => {
        card.classList.toggle('is-flipped');
        if(navigator.vibrate) navigator.vibrate(20);
    });

    // --- Confirmação ---
    function openModal() { document.getElementById('modal').style.display = 'flex'; }
    function enviar() {
        const n = document.getElementById('guest').value;
        if(!n) return;
        window.location.href = `https://wa.me/5574988017089?text=${encodeURIComponent("Presença confirmada! — " + n)}`;
    }
</script>
</body>
</html>
